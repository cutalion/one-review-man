---
# LLM Configuration for Book Generation
llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.7
  timeout: 240
  default_options:
    max_tokens: 12000
  task_options:
    generation:
      max_tokens: 8000
    translation:
      max_tokens: 12000
    summarization:
      max_tokens: 2000
  # Model-specific default parameters - only specified parameters are passed to API
  model_settings:
    gpt-5-nano:
      max_completion_tokens: 2000
      # temperature omitted - not supported by gpt-5-nano
    gpt-5:
      max_completion_tokens: 8000  # Lower limit for faster generation
      reasoning_effort: "low"      # Optimize for speed over deep reasoning
      # temperature omitted - not supported by gpt-5
    gpt-4o:
      temperature: 0.7
      max_tokens: 12000
    gpt-4o-mini:
      temperature: 0.7
      max_tokens: 12000
    o3:
      max_completion_tokens: 12000
      # temperature omitted - not supported by o3
    o3-mini:
      max_completion_tokens: 8000
      # temperature omitted - not supported by o3-mini

# Illustration Configuration
# Illustration Configuration
illustration:
  provider: openrouter  # 'openai' or 'openrouter'
  model: google/gemini-2.5-flash-image  # Fast, cheaper model for testing
  style: comic book
  orientation: '1:1' # Options: 'landscape' (1792x1024), 'portrait' (1024x1792), 'square'/'1:1' (1024x1024)

