catchphrase: Behold… the merge shall accept its fate!
backstory: Lorenzo Takeda began his career as a quiet intern who accidentally caused
  the most catastrophic branching incident in company history—a single rebase gone
  wrong that took down staging for three entire days. Instead of being fired, he became
  obsessed with mastering version control, training under various mentors including
  a retired DevOps Architect who taught him the forbidden art of resolving multiline
  conflict blocks without panic. Over the years, his skills grew so refined that he
  earned the title of Merge Master after single‑handedly untangling a thousand‑commit
  monstrosity left behind by a rogue framework migration. Now he protects the codebase
  not from bugs, but from the entropy of human collaboration itself.
quirks: Narrates every merge as though it were a legendary duel; insists on performing
