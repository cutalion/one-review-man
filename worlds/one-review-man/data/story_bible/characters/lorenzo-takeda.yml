name: Lorenzo Takeda
description: Lorenzo Takeda, known across the engineering floors as the Merge Master,
  is a dramatic senior engineer whose presence is heralded by the echo of clacking
  mechanical keyboard switches and theatrical sighs. He stands as the self-appointed
  guardian of impossible Git conflicts, treating each merge like an ancient ritual
  requiring solemnity, flair, and at least one monologue.
