---
# Chapter form declines to declare a default_length — the world's
# generation.chapter_length_target takes precedence for this form alone
# (FR-004), preserving pre-014 behavior. If the world config is missing a
# target, PieceProducer falls back to default_shape.
name: chapter
category: text
default_shape: "1500 words"
prompt_template_path: ./chapter.prompt.txt
# 018a (FR-001/FR-002): chapter form returns a structured JSON envelope
# {title, summary, content, new_characters} from the LLM. PieceProducer
# routes structured forms through a different LLM call path and writes
# the structured fields directly into piece frontmatter (chapter-specific
# title/summary + universal id/form/canon_version/canon_delta_ref).
structured_output: true
canon_context:
  - all_characters
  - recent_events
  - current_chapter
