chapter_1: |
  # Heading
  Mock chapter 1 content.

# Used by US1 specs (T007): the chapter generator parses a `title` field
# from the LLM's structured response and uses it as the chapter title.
# Shape mirrors the real chapter-generation response; only the `title`
# field is consumed in the title-fix test. Update this fixture if the
# chapter-generation prompt output schema changes.
chapter_with_title: |
  {
    "title": "The Rejection Letter",
    "body": "# The Rejection Letter\n\nJax opened his laptop and stared at the inbox...\n",
    "word_count": 42
  }

# Used by US3 specs (T031, T034) and the first-run integration spec (T037).
# SeedExtractor asks the LLM for premise-derived candidates and expects
# strict JSON. Arrays are capped to ≤3 characters, ≤2 locations, ≤3 facts.
# Every character/location hash carries origin: "seed".
seed_extractor_default: |
  {
    "characters": [
      {
        "id": "jax_patel",
        "name": "Jax Patel",
        "description": "A laid-off mid-level backend engineer hunting for his next role.",
        "origin": "seed",
        "origin_note": "derived from premise"
      }
    ],
    "locations": [
      {
        "id": "home_office",
        "name": "The Home Office",
        "description": "A cramped spare bedroom where Jax runs his job search.",
        "origin": "seed",
        "origin_note": "derived from premise"
      }
    ],
    "facts": [
      "The tech job market is in a prolonged downturn.",
      "Most applications go unanswered for weeks."
    ]
  }
chapter_2: |
  # Heading
  Mock chapter 2 content.

# Used by 014-storyworld-pivot US1 specs. The MockLLMService inspects the
# outgoing prompt for a form-specific signature (see extract_form_hint) and
# returns one of these `form_<name>` fixtures. The body ends with a canonical
# `---CANON-DELTA---` tail so US3 parsing has something to chew on; US1
# discards the tail.
form_vignette: |
  Jax stared at the grey rectangle of his monitor, coffee long cold. The inbox
  sat at zero unread. He refreshed it anyway. Somewhere in the spare bedroom,
  the radiator coughed once and went quiet.

  ---CANON-DELTA---
  new_characters: []
  new_locations: []
  new_facts: []
  new_events: []
  new_relationships: []
  entity_updates: []

form_haiku: |
  cold inbox blinking —
  the radiator coughs once,
  nothing to refresh

  ---CANON-DELTA---
  new_characters: []
  new_locations: []
  new_facts: []
  new_events: []
  new_relationships: []
  entity_updates: []

form_portrait: |
  Medium-close portrait of Jax Patel at his spare-bedroom desk, hunched in a
  grey hoodie, overhead lamp casting a warm pool, cool monitor light on his
  face, empty coffee cups framing the foreground, house style of muted mid-
  fidelity illustration.

  ---CANON-DELTA---
  new_characters: []
  new_locations: []
  new_facts: []
  new_events: []
  new_relationships: []
  entity_updates: []

# T050 — US3 / feature 014-storyworld-pivot. Three canon-delta shapes the
# US3 CLI / producer specs exercise.

canon_delta_clean: |
  A vignette that introduces a brand-new character cleanly.

  ---CANON-DELTA---
  new_characters:
    - id: kev-bot
      name: Kev-Bot
      description: Self-described lifestyle not a bot.
  new_locations: []
  new_facts: []
  new_events: []
  new_relationships: []
  entity_updates: []

canon_delta_conflict: |
  A vignette whose entity_update collides with existing canon.

  ---CANON-DELTA---
  new_characters: []
  new_locations: []
  new_facts: []
  new_events: []
  new_relationships: []
  entity_updates:
    - entity_kind: character
      entity_id: kev-bot
      attribute: description
      old_value: Some stale old description
      new_value: Radically different new description

canon_delta_malformed: |
  A piece whose tail never includes the sentinel line. Parse must flag
  this as :malformed-delta while preserving the body on disk.

  The canon delta section was supposed to be here but the LLM forgot it.

panel_descriptions: |
  [
    {
      "sequence": 1,
      "scene_description": "A tired programmer in a grey hoodie slouches at his desk, staring at a monitor showing a perfect code review with zero comments. His expression is one of profound boredom. Medium shot from slightly above, cool blue monitor light casting shadows on his face, empty coffee cups scattered across the desk.",
      "characters": ["kenji_yamamoto"],
      "text_elements": [
        { "type": "speech_bubble", "speaker": "kenji_yamamoto", "text": "Another perfect review... how boring." }
      ]
    },
    {
      "sequence": 2,
      "scene_description": "The programmer walks through a bustling open-plan office, colleagues frantically debugging around him while he yawns. Wide shot with shallow depth of field focusing on the protagonist, warm fluorescent office lighting, chaotic energy in the background contrasting his calm posture.",
      "characters": ["kenji_yamamoto"],
      "text_elements": []
    },
    {
      "sequence": 3,
      "scene_description": "Close-up of the programmer's hands typing on a keyboard, code flowing onto the screen in perfect formation. His face reflected in the monitor shows tired, dark-circled eyes. Extreme close-up, green code reflection on his glasses, dramatic low-key lighting.",
      "characters": ["kenji_yamamoto"],
      "text_elements": [
        { "type": "sound_effect", "text": "TAP TAP TAP" }
      ]
    },
    {
      "sequence": 4,
      "scene_description": "The programmer sits alone on a rooftop at sunset, looking at his phone showing yet another merged pull request notification. A single tear of boredom rolls down his cheek. Wide establishing shot, warm golden hour lighting, silhouette against orange sky, lonely composition with vast empty space.",
      "characters": ["kenji_yamamoto"],
      "text_elements": [
