inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - '_site/**/*'
    - '.jekyll-cache/**/*'
    - 'vendor/**/*'
    - 'Gemfile.lock'

Layout/LineLength:
  AllowedPatterns:
    - '\s*#.*'
    - '^\s*PROMPT.*'

# Disable block length metrics for RSpec specs since they naturally have long describe/it blocks
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
